name: Deploy to hosting (pull via PHP endpoint)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server-side pull deploy
        run: |
          response=$(curl -sS -w "\n%{http_code}" "https://verto.by/_deploy.php?token=${{ secrets.DEPLOY_TOKEN }}&sha=${{ github.sha }}")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "Deploy endpoint returned HTTP $code"
            exit 1
          fi
